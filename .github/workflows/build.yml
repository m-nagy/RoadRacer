name: Build

# Builds the Windows executable (a release build: no debug features, no debug symbols).
#   - "template" compiles a small 2D-only Godot export template (see .github/godot/custom.py). It is slow the
#     first time and cached after that. If it fails, the build falls back to Godot's stock release template.
#   - "windows" exports the game, checks the result (no debug symbols, no script source inside) and packages it.
#   - "windows-smoke" starts the exported exe on Windows and plays a short race.
# Pushing a tag that starts with "v" (for example v1.0.0) also publishes a GitHub Release with
# RoadRacer-windows.zip attached.

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  template:
    runs-on: ubuntu-latest
    continue-on-error: true   # the game can still be built with the stock template if this fails
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Cache the template
        id: cache
        uses: actions/cache@v4
        with:
          path: template
          key: template-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/godot/custom.py') }}

      - name: Install the compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config mingw-w64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          python3 -m pip install scons

      - name: Build the template
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${GODOT_VERSION}-stable" https://github.com/godotengine/godot.git godot-src
          cp .github/godot/custom.py godot-src/custom.py
          cd godot-src
          scons platform=windows arch=x86_64 use_mingw=yes profile=custom.py -j"$(nproc)"
          mkdir -p ../template
          cp bin/godot.windows.template_release.x86_64.exe ../template/windows_release_x86_64.exe
          ls -l ../template

      - uses: actions/upload-artifact@v4
        with:
          name: custom-template
          path: template/windows_release_x86_64.exe
          retention-days: 7

  windows:
    needs: template
    if: ${{ !cancelled() }}   # also when the template job failed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot downloads
        uses: actions/cache@v4
        with:
          path: ~/godot-download
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        run: |
          mkdir -p ~/godot-download
          cd ~/godot-download
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          [ -f godot.zip ] || curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          [ -f templates.tpz ] || curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      - name: Install Godot and export templates
        run: |
          cd ~/godot-download
          unzip -q -o godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          templates_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates_dir"
          unzip -q -o templates.tpz -d templates-unpacked
          mv templates-unpacked/templates/* "$templates_dir/"
          godot --version

      - name: Get the custom template
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: custom-template
          path: custom-template

      - name: Use the custom template (or fall back to the stock one)
        run: |
          if [ -f custom-template/windows_release_x86_64.exe ]; then
            sed -i "s#custom_template/release=\"\"#custom_template/release=\"$PWD/custom-template/windows_release_x86_64.exe\"#" export_presets.cfg
            echo "TEMPLATE=custom 2D-only template" >> "$GITHUB_ENV"
          else
            echo "TEMPLATE=stock Godot template (the custom template was not built)" >> "$GITHUB_ENV"
          fi
          grep custom_template/release export_presets.cfg

      - name: Import project resources
        run: godot --headless --path . --import || true

      - name: Export Windows build
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/RoadRacer.exe
          ls -l build

      - name: Check the exe icon / name were applied
        run: |
          # Godot edits the exe resources itself (no rcedit / wine needed); fail if that did not happen.
          strings -el build/RoadRacer.exe | grep -q "Road Racer"

      - name: Check there are no debug symbols
        run: |
          sudo apt-get install -y binutils-mingw-w64-x86-64
          sections="$(x86_64-w64-mingw32-objdump -h build/RoadRacer.exe)"
          echo "$sections" | awk '{print $2}' | grep -E '^\.' | tr '\n' ' '; echo
          if echo "$sections" | grep -qE '\.debug_|\.zdebug_'; then
            echo "::error::The exe contains debug symbols"; exit 1
          fi

      - name: Check what is inside the exe
        run: python3 .github/scripts/pck_list.py build/RoadRacer.exe

      - name: Package
        run: |
          cd build
          zip RoadRacer-windows.zip RoadRacer.exe
          {
            echo "### Windows build"
            echo "- Template: $TEMPLATE"
            echo "- RoadRacer.exe: $(du -h RoadRacer.exe | cut -f1), RoadRacer-windows.zip: $(du -h RoadRacer-windows.zip | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: RoadRacer-windows
          path: build/RoadRacer-windows.zip

  windows-smoke:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RoadRacer-windows

      - name: Play a short race with the exported exe
        shell: bash
        run: |
          unzip -q RoadRacer-windows.zip
          # --expect-release makes the check fail if this is not a release build
          ./RoadRacer.exe --headless -- --smoke-test --expect-release 2>&1 | tee smoke.log
          grep -q "^SMOKE OK" smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load|Failed loading|Can't open" smoke.log; then
            echo "::error::Errors were logged while the game ran"; exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, windows-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RoadRacer-windows

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" RoadRacer-windows.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Road Racer $GITHUB_REF_NAME" \
            --generate-notes
